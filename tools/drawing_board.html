<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹 그림판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f0;font-family:system-ui,'Malgun Gothic',sans-serif;color:#263e2e}.app{max-width:1500px;margin:20px auto;padding:18px}h1{font-size:25px;margin:0 0 18px}.drawing-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:start}.toolbar{background:white;border:1px solid #dce4d6;border-radius:14px;padding:14px;display:grid;gap:14px}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.section-label{font-size:12px;color:#718169;margin:0 0 8px}button{font:inherit;border:1px solid #d4dfcc;border-radius:8px;background:white;padding:10px 8px;cursor:pointer;font-size:13px;color:#3d5736}button.active{background:#355c3d;color:white;border-color:#355c3d}button.primary{background:#355c3d;color:white;border-color:#355c3d}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid #91b97a;outline-offset:2px}label{display:grid;gap:6px;font-size:12px}input[type=color]{width:100%;height:34px;border:1px solid #dce4d6;border-radius:6px;background:white;cursor:pointer}input[type=range]{width:100%;margin:0}textarea{width:100%;min-height:72px;resize:vertical;padding:8px;border:1px solid #d4dfcc;border-radius:7px;font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}input[type=number]{width:100%;padding:8px;border:1px solid #d4dfcc;border-radius:7px;font:inherit}.check{display:flex;align-items:center;gap:7px}.actions{display:grid;gap:7px;border-top:1px solid #e7ecdf;padding-top:12px}.canvas-wrap{min-width:0;background:white;border:1px solid #dce4d6;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:560px;touch-action:none;cursor:crosshair}.hint{font-size:12px;line-height:1.7;color:#718169;margin:12px 0}#textOptions{display:grid;gap:10px}[hidden]{display:none!important}@media(max-width:640px){.app{margin:0;padding:12px}.drawing-layout{grid-template-columns:1fr}.toolbar{gap:12px}.tool-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{grid-template-columns:repeat(3,1fr)}canvas{height:55vh;min-height:320px}.toolbar #textOptions{grid-template-columns:1fr 85px}}
</style></head><body><main class="app"><h1>🎨 웹 그림판</h1><div class="drawing-layout">
<aside class="toolbar" aria-label="그림 도구"><div><p class="section-label">그리기 도구</p><div class="tool-grid" role="group" aria-label="도구 선택">
<button type="button" data-tool="pen" class="active" aria-pressed="true">✏ 펜</button><button type="button" data-tool="eraser" aria-pressed="false">지우개</button><button type="button" data-tool="line" aria-pressed="false">╱ 직선</button><button type="button" data-tool="rect" aria-pressed="false">□ 사각형</button><button type="button" data-tool="ellipse" aria-pressed="false">○ 원</button><button type="button" data-tool="triangle" aria-pressed="false">△ 삼각형</button><button type="button" data-tool="text" aria-pressed="false">가 글자</button>
</div></div><div class="settings"><label>색상<input type="color" id="color" value="#355c3d"></label><label>선 굵기 <output id="widthLabel">5px</output><input type="range" id="width" min="1" max="60" value="5"></label></div>
<label class="check"><input type="checkbox" id="fillShape">도형 내부 채우기</label><div id="textOptions" hidden><label>넣을 글자<textarea id="textValue" placeholder="여기에 글자를 입력하세요" maxlength="500" rows="3"></textarea></label><label>글자 크기 (px)<input id="fontSize" type="number" min="10" max="160" value="32"></label></div>
<div class="actions"><button id="undo" type="button" disabled>↶ 실행 취소</button><button id="clear" type="button">전체 지우기</button><button id="save" class="primary" type="button">↓ PNG 저장</button></div></aside>
<section><div class="canvas-wrap"><canvas id="canvas" aria-label="그림 그리기 영역"></canvas></div><p class="hint" id="drawingStatus" role="status">마우스 또는 손가락으로 자유롭게 그리세요.</p></section></div></main><script src="assets/drawing-board.js?v=shapes-1"></script></body></html>
