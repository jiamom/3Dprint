<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹 그림판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;font-family:system-ui,'Malgun Gothic',sans-serif;color:#202733}.app{max-width:1000px;margin:30px auto;padding:18px}h1{font-size:25px;margin:0 0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #172b4d12}button{border:1px solid #d4dbe5;border-radius:9px;background:#fff;padding:10px 14px;cursor:pointer;font-size:14px}button.active{background:#2563eb;color:white;border-color:#2563eb}button.primary{background:#176bde;color:white;border-color:#176bde}label{display:flex;gap:7px;align-items:center;font-size:14px}input[type=color]{width:38px;height:36px;border:0;background:transparent;cursor:pointer}input[type=range]{width:100px}.canvas-wrap{background:white;border:1px solid #dce1e9;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #172b4d12}canvas{display:block;width:100%;height:550px;touch-action:none;cursor:crosshair}.hint{font-size:13px;color:#667085;margin-top:12px}@media(max-width:600px){.app{margin:8px auto;padding:10px}canvas{height:65vh;min-height:320px}}
</style>
</head>
<body>
<div class="app">
<h1>🎨 웹 그림판</h1>
<div class="toolbar">
<button id="pen" class="active" type="button">✏️ 펜</button>
<button id="eraser" type="button">🧽 지우개</button>
<label>색상 <input type="color" id="color" value="#222222"></label>
<label>굵기 <input type="range" id="width" min="1" max="60" value="5"><span id="widthLabel">5px</span></label>
<button id="undo" type="button">↶ 실행 취소</button>
<button id="clear" type="button">전체 지우기</button>
<button id="save" class="primary" type="button">⬇ PNG 저장</button>
</div>
<div class="canvas-wrap"><canvas id="canvas" aria-label="그림 그리기 영역"></canvas></div>
<p class="hint">마우스 또는 손가락으로 그리세요. 저장 버튼을 누르면 PNG 파일이 다운로드됩니다.</p>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const pen=document.getElementById('pen');
const eraser=document.getElementById('eraser');
const color=document.getElementById('color');
const width=document.getElementById('width');
const widthLabel=document.getElementById('widthLabel');
let tool='pen',drawing=false,last=null,history=[];
const MAX_HISTORY=30;
function resizeCanvas(){
  const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;
  if(canvas.width&&canvas.height)old.getContext('2d').drawImage(canvas,0,0);
  const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
  if(old.width&&old.height)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  history=[];
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
function snapshot(){if(history.length>=MAX_HISTORY)history.shift();history.push(ctx.getImageData(0,0,canvas.width,canvas.height));}
function selectTool(t){tool=t;pen.classList.toggle('active',t==='pen');eraser.classList.toggle('active',t==='eraser');}
pen.onclick=()=>selectTool('pen');eraser.onclick=()=>selectTool('eraser');
width.oninput=()=>widthLabel.textContent=width.value+'px';
function pos(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function start(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();snapshot();drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);drawSegment(last,last);}
function drawSegment(a,b){ctx.strokeStyle=tool==='eraser'?'#fff':color.value;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=tool==='eraser'?Number(width.value)*2:Number(width.value);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function move(e){if(!drawing)return;e.preventDefault();const next=pos(e);drawSegment(last,next);last=next;}
function stop(){drawing=false;last=null;}
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop);
document.getElementById('undo').onclick=()=>{const previous=history.pop();if(previous)ctx.putImageData(previous,0,0);};
document.getElementById('clear').onclick=()=>{if(!confirm('그림을 모두 지울까요?'))return;snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='my-drawing.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();};
</script>
</body>
</html>
